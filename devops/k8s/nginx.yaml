# ─────────────────────────────────────────────────────────────────────────────
# AI SupportOps — Nginx Reverse Proxy (Kubernetes)
# This is the ONLY externally accessible service (NodePort 30080)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: supportops
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: ai-supportops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
# ── Service (NodePort — externally accessible) ────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: supportops
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: ai-supportops
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080           # Access at http://<ELASTIC_IP>:30080
