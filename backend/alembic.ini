[alembic]
# Path to alembic env.py (relative to where `alembic` command is run)
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL is overridden at runtime in env.py using settings.sync_database_url
# This fallback is only used for `alembic init` and offline mode
sqlalchemy.url = postgresql+psycopg2://supportops:supportops_dev_password@localhost:5432/supportops

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
