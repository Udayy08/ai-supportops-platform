[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-supportops-backend"
version = "0.1.0"
description = "AI SupportOps — Multi-Agent Customer Support Resolution Platform (Backend)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]

# ── Runtime Dependencies ──────────────────────────────────────────────────────
[project.dependencies]
# Web framework
fastapi = ">=0.111.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
python-multipart = ">=0.0.9"

# Async database
sqlalchemy = { version = ">=2.0.30", extras = ["asyncio"] }
asyncpg = ">=0.29.0"                 # async PostgreSQL driver
alembic = ">=1.13.0"

# Redis
redis = { version = ">=5.0.4", extras = ["hiredis"] }

# Auth & security
python-jose = { version = ">=3.3.0", extras = ["cryptography"] }
passlib = { version = ">=1.7.4", extras = ["bcrypt"] }

# Settings
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"

# HTTP client
httpx = ">=0.27.0"

# Logging
structlog = ">=24.2.0"

# Observability
sentry-sdk = { version = ">=2.5.0", extras = ["fastapi"] }

# Utilities
python-dateutil = ">=2.9.0"
orjson = ">=3.10.3"

# ── Development Dependencies ──────────────────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.2.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

# ── Tool Config ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
