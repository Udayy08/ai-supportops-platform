# ─────────────────────────────────────────────────────────────────────────────
# AI SupportOps — Docker Compose (Local Development)
# Services: backend, postgres, redis, chromadb, nginx
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      target: production

    container_name: supportops_backend

    restart: unless-stopped

    env_file:
      - ../backend/.env

    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb

    ports:
      - "8000:8000"

    volumes:
      - ../backend:/app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      chromadb:
        condition: service_started

    networks:
      - supportops_net

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine

    container_name: supportops_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops_dev_password

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - supportops_net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine

    container_name: supportops_redis

    restart: unless-stopped

    command: redis-server --appendonly yes --requirepass ""

    ports:
      - "6379:6379"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - supportops_net

  # ── ChromaDB (Vector Store) ─────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest

    container_name: supportops_chromadb

    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - chromadata:/chroma/chroma

    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

    networks:
      - supportops_net

  # ── Nginx (Reverse Proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine

    container_name: supportops_nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - supportops_net

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

  redisdata:
    driver: local

  chromadata:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  supportops_net:
    driver: bridge